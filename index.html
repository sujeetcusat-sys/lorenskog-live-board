<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Lørenskog Live Board</title>
<style>
:root{--bg:#07111f;--panel:#101e30;--line:#26384d;--muted:#9fb0c4;--white:#f5f8fc;--green:#39d98a;--amber:#ffc857;--red:#ff6b6b;--blue:#75baff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{padding:clamp(10px,2vw,24px);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.brand{font-size:clamp(17px,2.1vw,27px);font-weight:800;letter-spacing:.08em}
.sub{color:var(--muted);font-size:clamp(10px,1.1vw,14px);letter-spacing:.12em;text-transform:uppercase}
.clock{text-align:right;font-size:clamp(25px,4vw,48px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.date{color:var(--muted);font-size:clamp(10px,1.1vw,14px);margin-top:5px}
main{height:calc(100% - 82px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(10px,1.5vw,18px);min-height:0;overflow:hidden}
.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
h2{font-size:clamp(14px,1.6vw,20px);margin:0;letter-spacing:.08em}
.tag{font-size:clamp(9px,1vw,12px);color:var(--muted);text-transform:uppercase}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:clamp(7px,1vw,12px) 4px;border-bottom:1px solid var(--line);font-size:clamp(12px,1.35vw,17px);vertical-align:middle}
tr:last-child td{border-bottom:0}
.route{font-weight:900;font-size:clamp(13px,1.5vw,19px);width:19%;white-space:nowrap}
.dest{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.platform{color:var(--muted);font-size:.78em;display:block;margin-top:2px}
.when{text-align:right;width:24%;font-weight:850;font-size:clamp(15px,1.9vw,24px);white-space:nowrap;font-variant-numeric:tabular-nums}
.soon{color:var(--green)}.delayed{color:var(--amber)}.cancelled{color:var(--red);text-decoration:line-through}
.empty{color:var(--muted);padding:20px 4px;font-size:14px}
.weather{grid-column:1/-1;display:grid;grid-template-columns:1.1fr 1fr 1.2fr;align-items:center;gap:12px;padding:12px 18px}
.current{display:flex;align-items:center;gap:14px}.temp{font-size:clamp(27px,4vw,46px);font-weight:850;line-height:1}.condition{color:var(--muted);font-size:clamp(11px,1.2vw,15px);margin-top:4px}
.metrics{display:flex;gap:clamp(10px,2vw,28px);justify-content:center;flex-wrap:wrap}
.metric strong{display:block;font-size:clamp(13px,1.5vw,18px)}.metric span{color:var(--muted);font-size:clamp(9px,1vw,12px)}
.forecast{display:flex;justify-content:space-around;gap:8px;text-align:center}
.forecast div{font-size:clamp(10px,1.1vw,14px);color:var(--muted)}.forecast strong{display:block;color:var(--white);font-size:clamp(12px,1.4vw,17px);margin-top:3px}
.status{position:fixed;bottom:5px;right:12px;color:#71839a;font-size:10px}
@media(max-width:650px){body{overflow:auto}main{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto auto}.panel{min-height:230px}.weather{grid-column:auto;grid-template-columns:1fr 1fr}.forecast{grid-column:1/-1}.status{position:static;text-align:right;margin-top:6px}}
</style>
</head>
<body>
<header>
 <div><div class="brand">LØRENSKOG <span style="color:var(--blue)">LIVE</span></div><div class="sub">Train & bus departures · Norway</div></div>
 <div><div class="clock" id="clock">--:--</div><div class="date" id="date">Loading date…</div></div>
</header>
<main>
 <section class="panel">
  <div class="panelhead"><h2>🚆 TRAINS</h2><span class="tag">Lørenskog stasjon</span></div>
  <div id="trains" class="empty">Loading train departures…</div>
 </section>
 <section class="panel">
  <div class="panelhead"><h2>🚌 BUSES</h2><span class="tag">Lørenskog stasjon</span></div>
  <div id="buses" class="empty">Loading bus departures…</div>
 </section>
 <section class="panel weather">
  <div class="current"><div id="weatherIcon" style="font-size:clamp(34px,5vw,58px)">🌤️</div><div><div class="temp" id="temp">--°</div><div class="condition" id="condition">Loading weather…</div></div></div>
  <div class="metrics">
   <div class="metric"><strong id="rain">--%</strong><span>Rain chance</span></div>
   <div class="metric"><strong id="wind">--</strong><span>Wind km/h</span></div>
   <div class="metric"><strong id="feels">--°</strong><span>Feels like</span></div>
  </div>
  <div class="forecast" id="forecast"><div>Later<strong>--°</strong></div><div>Evening<strong>--°</strong></div><div>Tomorrow<strong>--°</strong></div></div>
 </section>
</main>
<div class="status" id="status">Connecting to live data…</div>
<script>
const STOP_ID = "NSR:StopPlace:58857"; // Lørenskog stasjon
const LAT = 59.94480, LON = 10.94460;
const ENTUR_URL = "https://api.entur.io/journey-planner/v3/graphql";
const QUERY = `query Board($stopPlaceId: String!, $numberOfDepartures: Int = 24, $startTime: DateTime) {
 stopPlace(id: $stopPlaceId) {
  name
  estimatedCalls(numberOfDepartures: $numberOfDepartures, includeCancelledTrips: true, startTime: $startTime) {
   quay { publicCode name }
   destinationDisplay { frontText }
   aimedDepartureTime expectedDepartureTime
   serviceJourney { transportMode line { publicCode } }
   cancellation realtime
  }
 }
}`;
const $ = id => document.getElementById(id);
const tz = "Europe/Oslo";
function tick(){
 const now = new Date();
 $("clock").textContent = new Intl.DateTimeFormat("nb-NO",{hour:"2-digit",minute:"2-digit",timeZone:tz}).format(now);
 $("date").textContent = new Intl.DateTimeFormat("nb-NO",{weekday:"long",day:"numeric",month:"long",timeZone:tz}).format(now);
}
function mins(iso){return Math.max(0,Math.round((new Date(iso)-Date.now())/60000))}
function time(iso){return new Intl.DateTimeFormat("nb-NO",{hour:"2-digit",minute:"2-digit",timeZone:tz}).format(new Date(iso))}
function renderRows(target,calls){
 if(!calls.length){$(target).innerHTML='<div class="empty">No upcoming departures found.</div>';return}
 const rows=calls.slice(0,8).map(c=>{
  const dep=c.expectedDepartureTime||c.aimedDepartureTime;
  const m=mins(dep), cancelled=!!c.cancellation;
  const delay=Math.round((new Date(c.expectedDepartureTime||c.aimedDepartureTime)-new Date(c.aimedDepartureTime))/60000);
  const when=cancelled?'CANCELLED':m===0?'NOW':m+' min';
  const cls=cancelled?'cancelled':delay>=3?'delayed':'soon';
  const route=c.serviceJourney?.line?.publicCode||'';
  const dest=c.destinationDisplay?.frontText||'Destination';
  const platform=c.quay?.publicCode||c.quay?.name||'';
  return `<tr><td class="route">${esc(route)}</td><td class="dest">${esc(dest)}${platform?`<span class="platform">Platform ${esc(platform)}</span>`:''}</td><td class="when ${cls}">${when}<span class="platform">${time(dep)}${delay>=3&&!cancelled?' · +'+delay+' min':''}</span></td></tr>`;
 }).join('');
 $(target).innerHTML='<table><tbody>'+rows+'</tbody></table>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadTransit(){
 try{
  const r=await fetch(ENTUR_URL,{method:'POST',headers:{'Content-Type':'application/json','ET-Client-Name':'home-lorenskog-departure-board'},body:JSON.stringify({query:QUERY,variables:{stopPlaceId:STOP_ID,numberOfDepartures:30,startTime:new Date().toISOString()}})});
  if(!r.ok) throw new Error('Entur HTTP '+r.status);
  const j=await r.json(); if(j.errors?.length) throw new Error(j.errors[0].message);
  const calls=j.data?.stopPlace?.estimatedCalls||[];
  const upcoming=calls.filter(c=>new Date(c.expectedDepartureTime||c.aimedDepartureTime)>=new Date(Date.now()-60000));
  renderRows('trains',upcoming.filter(c=>['rail','metro','tram'].includes((c.serviceJourney?.transportMode||'').toLowerCase())));
  renderRows('buses',upcoming.filter(c=>(c.serviceJourney?.transportMode||'').toLowerCase()==='bus'));
  $("status").textContent='Transport updated '+time(new Date().toISOString())+' · refreshes every 45 sec';
 }catch(e){
  $("status").textContent='Transport feed unavailable: '+e.message;
  if($("trains").textContent.includes('Loading')) $("trains").textContent='Could not load departures. Check connection / browser access.';
  if($("buses").textContent.includes('Loading')) $("buses").textContent='Could not load departures. Check connection / browser access.';
 }
}
const weatherCode = code => {
 if(code===0)return ['☀️','Clear']; if([1,2].includes(code))return ['🌤️','Partly cloudy']; if(code===3)return ['☁️','Cloudy'];
 if([45,48].includes(code))return ['🌫️','Fog']; if([51,53,55,56,57].includes(code))return ['🌦️','Drizzle'];
 if([61,63,65,66,67,80,81,82].includes(code))return ['🌧️','Rain']; if([71,73,75,77,85,86].includes(code))return ['❄️','Snow'];
 if([95,96,99].includes(code))return ['⛈️','Thunderstorm']; return ['🌡️','Weather'];
};
async function loadWeather(){
 try{
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=precipitation_probability,temperature_2m&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=2&timezone=Europe%2FOslo`;
  const r=await fetch(url);if(!r.ok)throw new Error('Weather HTTP '+r.status);const j=await r.json();
  const [icon,desc]=weatherCode(j.current.weather_code);
  $("weatherIcon").textContent=icon;$("temp").textContent=Math.round(j.current.temperature_2m)+'°C';$("condition").textContent=desc;
  $("wind").textContent=Math.round(j.current.wind_speed_10m);$("feels").textContent=Math.round(j.current.apparent_temperature)+'°';
  const now=new Date(), idx=j.hourly.time.findIndex(t=>new Date(t)>=now);
  $("rain").textContent=(j.hourly.precipitation_probability[Math.max(0,idx)]??0)+'%';
  const d=j.daily;
  const fmt=(i)=>`${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°`;
  $("forecast").innerHTML=`<div>Today<strong>${fmt(0)}</strong></div><div>Tomorrow<strong>${fmt(1)}</strong></div><div>Rain now<strong>${Math.round(j.current.precipitation)} mm</strong></div>`;
 }catch(e){$("condition").textContent='Weather unavailable';}
}
tick();setInterval(tick,1000);loadTransit();loadWeather();setInterval(loadTransit,45000);setInterval(loadWeather,1800000);
</script>
</body>
</html>
